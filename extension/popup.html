<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screen Companion Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #6c63ff, #4facfe);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }

    .subtitle {
      font-size: 11px;
      color: #888;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #16213e;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.connected    { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
    .dot.connecting   { background: #ff9800; box-shadow: 0 0 6px #ff9800; }
    .dot.disconnected { background: #f44336; box-shadow: 0 0 6px #f44336; }

    .status-text {
      font-size: 12px;
      color: #ccc;
    }

    .page-info {
      background: #16213e;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .page-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
      margin-bottom: 4px;
    }

    .page-title {
      font-size: 12px;
      color: #ccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hint {
      font-size: 11px;
      color: #555;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🧠</div>
    <div>
      <div class="title">Screen Companion</div>
      <div class="subtitle">Browser Bridge</div>
    </div>
  </div>

  <div class="status-row">
    <div class="dot disconnected" id="dot"></div>
    <span class="status-text" id="status-text">Connecting…</span>
  </div>

  <div class="page-info">
    <div class="page-label">Active page</div>
    <div class="page-title" id="page-title">—</div>
  </div>

  <div class="hint" id="hint">
    Make sure Screen Companion is running.
  </div>

  <script src="popup.js"></script>
</body>
</html>
